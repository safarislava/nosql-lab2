name: nosql_lab2

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nosql_store
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/scripts/init_postgres.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nosql_store"]
      interval: 5s
      timeout: 5s
      retries: 10

  riak:
    image: basho/riak-kv:ubuntu-2.2.3
    platform: linux/amd64
    hostname: riak
    environment:
      CLUSTER_NAME: riakkv
    labels:
      com.basho.riak.cluster.name: riakkv
    ports:
      - "8087:8087"
      - "8098:8098"
    volumes:
      - riak-data:/var/lib/riak
      - ./backend/scripts/riak-prestart.sh:/etc/riak/prestart.d/00-prestart.sh:ro
      - ./backend/scripts/riak-poststart.sh:/etc/riak/poststart.d/00-poststart.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://127.0.0.1:8098/ping >/dev/null && [ -f /tmp/.riak_initialized ] || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  couchdb1:
    image: couchdb:3.4
    container_name: couchdb1
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: password
    ports:
      - "5984:5984"
    volumes:
      - couchdb1-data:/opt/couchdb/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://127.0.0.1:5984/ >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  couchdb2:
    image: couchdb:3.4
    container_name: couchdb2
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: password
    ports:
      - "5985:5984"
    volumes:
      - couchdb2-data:/opt/couchdb/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://127.0.0.1:5984/ >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      riak:
        condition: service_healthy
      couchdb1:
        condition: service_healthy
      couchdb2:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  postgres-data:
  riak-data:
  couchdb1-data:
  couchdb2-data:
