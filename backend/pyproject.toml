[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bcrypt>=4.2.0",
    "email-validator>=2.3.0",
    "fastapi==0.142.2",
    "httpx>=0.28.1",
    "psycopg-pool==3.3.3",
    "psycopg[binary,pool]>=3.2.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt==2.15.1",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8.0.0",
    "ruff==0.16.8",
]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
